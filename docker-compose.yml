services:
  app:
    build: .
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: '4000'
      DATA_DIR: /data
      JWT_SECRET: ${JWT_SECRET:-gapswap-dev-secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - swapgap-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  swapgap-data:

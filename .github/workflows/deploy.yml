name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: render-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install Render CLI
        env:
          RENDER_CLI_VERSION: '2.28.0'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/render.zip \
            "https://github.com/render-oss/cli/releases/download/v${RENDER_CLI_VERSION}/cli_${RENDER_CLI_VERSION}_linux_amd64.zip"
          unzip -qo /tmp/render.zip -d /tmp/render-cli
          bin="$(find /tmp/render-cli -type f \( -name 'cli*' -o -name 'render' \) ! -name '*.zip' | head -n 1)"
          if [ -z "$bin" ]; then
            echo "Render CLI binary not found in the downloaded archive."
            ls -la /tmp/render-cli
            exit 1
          fi
          sudo install -m 0755 "$bin" /usr/local/bin/render
          render --version

      - name: Deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID || vars.RENDER_SERVICE_ID }}
          CI: 'true'
          DO_NOT_TRACK: '1'
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "Add a Render API key as the GitHub secret RENDER_API_KEY."
            echo "Render Dashboard → Account Settings → API Keys"
            exit 1
          fi

          if [ -z "${RENDER_SERVICE_ID:-}" ]; then
            echo "Set GitHub secret or variable RENDER_SERVICE_ID to the web service ID (srv-...)."
            echo "Render Dashboard → your web service → copy the ID from the URL or Settings."
            exit 1
          fi

          echo "Deploying service $RENDER_SERVICE_ID at $GITHUB_SHA"
          render deploys create "$RENDER_SERVICE_ID" \
            --commit "$GITHUB_SHA" \
            --wait \
            --confirm \
            --output json
